name: ai4galaxy
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - torch>=2.2
    - torchvision
    - pytorch-lightning>=2.2
    - omegaconf
    - wandb
    - astropy
    - safetensors
    - xformers
    - reproject
    - natsort
    - packaging
    - tqdm
    - numpy
    - scipy
    - matplotlib
    - pytest
